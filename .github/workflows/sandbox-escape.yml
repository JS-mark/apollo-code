name: L1 sandbox escape
on:
  pull_request:
  push:
    branches: [main]
jobs:
  escape:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, verification: native }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, verification: native }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, verification: native }
          - { runner: ubuntu-24.04, target: aarch64-unknown-linux-gnu, verification: partial-verified }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.verification == 'partial-verified'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - if: matrix.verification == 'partial-verified'
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - if: runner.os == 'Linux' && matrix.verification == 'native'
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - if: matrix.verification == 'native'
        run: cargo test -p apollo-sandbox
      - if: matrix.verification == 'native'
        run: cargo build -p apollo-sandbox --bin apollo-sandbox
      - if: matrix.verification == 'native'
        run: bash crates/apollo-sandbox/tests/escape/run.sh target/debug/apollo-sandbox
      - if: matrix.verification == 'partial-verified'
        run: |
          cargo build -p apollo-sandbox --target aarch64-unknown-linux-gnu
          echo 'Cross-build and embedded payload digest compile-time verified; syscall isolation requires a real arm64 runner.' | tee escape-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: escape-${{ matrix.target }}
          path: escape-verification.txt
          if-no-files-found: ignore
