name: L2 native (8 targets)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  license:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
  native:
    needs: license
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, verification: native }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, verification: native }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, verification: native }
          - {
              runner: ubuntu-24.04,
              target: aarch64-unknown-linux-gnu,
              verification: partial-verified,
            }
          - {
              runner: ubuntu-24.04,
              target: x86_64-unknown-linux-musl,
              verification: partial-verified,
            }
          - {
              runner: ubuntu-24.04,
              target: aarch64-unknown-linux-musl,
              verification: partial-verified,
            }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc, verification: native }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, verification: native }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-arm64-cross
      - if: contains(matrix.target, 'aarch64-unknown-linux')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
          echo 'QEMU_LD_PREFIX=/usr/aarch64-linux-gnu' >> "$GITHUB_ENV"
      - if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@v2
      - if: contains(matrix.target, 'musl')
        run: cargo install cargo-zigbuild --locked
      - if: contains(matrix.target, 'musl')
        run: cargo zigbuild --workspace --release --target ${{ matrix.target }}
      - if: ${{ !contains(matrix.target, 'musl') }}
        run: cargo check --workspace --target ${{ matrix.target }}
      - if: ${{ !contains(matrix.target, 'musl') }}
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - if: runner.os == 'Linux' && matrix.verification == 'native'
        run: target/${{ matrix.target }}/release/apollo-sandbox --verify-bwrap-digest
      - if: matrix.verification == 'native' && runner.os != 'Windows'
        run: cargo test --workspace --target ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - name: Export target artifact paths
        shell: bash
        run: |
          extension=''
          case '${{ matrix.target }}' in *windows*) extension='.exe' ;; esac
          echo "APOLLO_NATIVE_SANDBOX_BINARY=target/${{ matrix.target }}/release/apollo-sandbox$extension" >> "$GITHUB_ENV"
          echo "APOLLO_NATIVE_SEARCH_BINARY=target/${{ matrix.target }}/release/apollo-search$extension" >> "$GITHUB_ENV"
          echo "APOLLO_NATIVE_FS_BINARY=target/${{ matrix.target }}/release/apollo-fs$extension" >> "$GITHUB_ENV"
      - name: Run strict doctor against sandbox-capable target artifacts
        if: runner.os != 'Windows'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ci-doctor-placeholder
        run: node apps/cli/dist/apollo.js doctor --strict --json
      - name: Verify Windows foundation health and fail-closed sandbox disclosure
        if: runner.os == 'Windows'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ci-doctor-placeholder
        run: |
          output=$(node apps/cli/dist/apollo.js doctor --json)
          printf '%s\n' "$output"
          grep -F 'Sandbox: NONE' <<<"$output"
          grep -F 'Windows Tier 1/2 isolation is not active in this build; execution is refused' <<<"$output"
          grep -F '"name":"native sandbox","ok":false' <<<"$output"
          grep -F '"name":"native search","ok":true' <<<"$output"
          grep -F '"name":"native fs","ok":true' <<<"$output"
      - name: Stage platform packages
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            aarch64-apple-darwin) suffix=darwin-arm64 ;;
            x86_64-apple-darwin) suffix=darwin-x64 ;;
            aarch64-unknown-linux-gnu) suffix=linux-arm64-gnu ;;
            x86_64-unknown-linux-gnu) suffix=linux-x64-gnu ;;
            aarch64-unknown-linux-musl) suffix=linux-arm64-musl ;;
            x86_64-unknown-linux-musl) suffix=linux-x64-musl ;;
            aarch64-pc-windows-msvc) suffix=win32-arm64-msvc ;;
            x86_64-pc-windows-msvc) suffix=win32-x64-msvc ;;
          esac
          extension=''
          case '${{ matrix.target }}' in *windows*) extension='.exe' ;; esac
          for kind in sandbox search fs; do
            mkdir -p "platforms/native-$kind-$suffix/bin"
            cp "target/${{ matrix.target }}/release/apollo-$kind$extension" "platforms/native-$kind-$suffix/bin/apollo-$kind$extension"
            cp crates/apollo-sandbox-vendor/LICENSE "platforms/native-$kind-$suffix/LICENSE"
            cp crates/apollo-sandbox-vendor/NOTICE "platforms/native-$kind-$suffix/NOTICE"
          done
      - run: echo '${{ matrix.verification }}' > native-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/apollo-sandbox*
            target/${{ matrix.target }}/release/apollo-search*
            target/${{ matrix.target }}/release/apollo-fs*
            native-verification.txt
            platforms/*/bin/*
            platforms/*/LICENSE
            platforms/*/NOTICE
  universal2:
    needs: native
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-aarch64-apple-darwin
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-apple-darwin
          path: x64
      - name: Create and verify universal2 binaries
        run: |
          mkdir universal2
          for kind in sandbox search fs; do
            lipo -create "arm64/target/aarch64-apple-darwin/release/apollo-$kind" "x64/target/x86_64-apple-darwin/release/apollo-$kind" -output "universal2/apollo-$kind"
            lipo "universal2/apollo-$kind" -verify_arch arm64 x86_64
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-darwin-universal2
          path: universal2/*
  signing-smoke:
    name: Authenticode self-sign smoke (non-production)
    needs: native
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64-pc-windows-msvc
          path: artifact
      - name: Self-sign and verify Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Apollo Code CI (NON-PRODUCTION)' -CertStoreLocation Cert:\CurrentUser\My
          $cerPath = Join-Path $env:RUNNER_TEMP 'apollo-code-ci.cer'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'apollo-code-ci.pfx'
          $pfxPasswordText = [Guid]::NewGuid().ToString()
          $pfxPassword = ConvertTo-SecureString $pfxPasswordText -AsPlainText -Force
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPassword | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'Windows SDK signtool.exe was not found' }
          $binaries = @(Get-ChildItem artifact -Recurse -Filter 'apollo-*.exe')
          if ($binaries.Count -ne 3) { throw "Expected 3 Windows binaries, found $($binaries.Count)" }
          $binaries | ForEach-Object {
            & $signTool sign /fd SHA256 /f $pfxPath /p $pfxPasswordText $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $($_.FullName)" }
            & $signTool verify /pa /all $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($_.FullName)" }
          }
          'verification=self-signed-flow-only' | Set-Content authenticode-evidence.txt
          'production_signature=false' | Add-Content authenticode-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: authenticode-self-sign-smoke
          path: authenticode-evidence.txt
  notarization-gate:
    name: macOS notarization credential gate
    needs: universal2
    runs-on: macos-14
    steps:
      - name: Record external notarization gate
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            printf 'credentials=available\nsubmission=release-workflow-required\n' > notarization-gate.txt
          else
            printf 'credentials=unavailable\nsubmission=blocked\n' > notarization-gate.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notarization-gate
          path: notarization-gate.txt
  bwrap-reproducibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: crates/apollo-sandbox/scripts/rebuild-bwrap.sh --check
