name: Windows signing contract (no-secret dry-run)

on:
  pull_request:
    paths:
      - '.github/workflows/windows-signing-dry-run.yml'
      - 'docs/releases/windows-signing-fixture.json'
      - 'docs/rfcs/windows-ev-store-migration.md'
      - 'scripts/verify-windows-release-evidence*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify fixture and negative signing evidence
        run: node --test scripts/verify-windows-release-evidence.test.mjs
      - name: Verify the checked-in no-secret fixture
        run: node scripts/verify-windows-release-evidence.mjs --input docs/releases/windows-signing-fixture.json
      - name: Prove fixture cannot satisfy production authorization
        shell: bash
        run: |
          if node scripts/verify-windows-release-evidence.mjs \
            --input docs/releases/windows-signing-fixture.json --production; then
            echo 'fixture unexpectedly satisfied production signing contract' >&2
            exit 1
          fi
          printf 'mode=fixture-only\nproduction_signing=false\nstore_submission=false\n' > windows-signing-dry-run.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-signing-contract-dry-run
          path: windows-signing-dry-run.txt
