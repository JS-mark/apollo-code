name: TypeScript quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Type-aware Oxlint resolves workspace package exports from dist declarations.
      - run: pnpm turbo run build
      - run: pnpm lint
      - run: pnpm turbo run typecheck test
      - name: Build the production plugin sandbox host
        run: cargo build -p apollo-sandbox --bin apollo-sandbox
      - name: Run plugin host E2E through the production native binary
        run: |
          pnpm --filter @apollo-code/plugin-runtime test -- src/e2e.test.ts
          pnpm --filter apollo-code exec vitest run src/runtime.test.ts
        env:
          APOLLO_RUN_PLUGIN_E2E: '1'
          APOLLO_NATIVE_SANDBOX_BINARY: ${{ github.workspace }}/target/debug/apollo-sandbox
