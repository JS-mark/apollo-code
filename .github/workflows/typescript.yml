name: TypeScript quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # P6-05（Web console 计划收尾）：对 Web 产物/server 源做 secret 指纹扫描。
  secret-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Web console secret audit
        run: ./scripts/release/web-secret-audit.sh

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Type-aware Oxlint resolves workspace package exports from dist declarations.
      - run: pnpm turbo run build
      - run: pnpm lint
      # 50%：quality 单机跑全仓 typecheck+test，满载下 vitest fork 风暴会让
      # 时序敏感用例（tui/task-store/daemon）概率性挂——限流换稳定。
      - run: pnpm turbo run typecheck test --concurrency=50%
      - name: Verify legacy plugin containment and package boundary
        run: |
          pnpm --filter @volund/plugin-runtime test -- src/__tests__/index.test.ts
          pnpm --filter ./apps/cli exec vitest run src/__tests__/architecture.test.ts src/__tests__/runtime.test.ts
          node --test scripts/verify-plugin-runtime-packlist.test.mjs
