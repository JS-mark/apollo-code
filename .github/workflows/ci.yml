name: L1 TypeScript
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            turbo-concurrency: 100%
            node-version: 24
          - runner: macos-14
            turbo-concurrency: 100%
            node-version: 24
        # windows-2022 已摘除：托管 runner 间歇性 0xC0000142（DLL init failure）
        # 杀 worker 进程，串行化 + 三次重跑也压不住；需要时按 ubuntu 项的形态
        # 加回 { runner: windows-2022, turbo-concurrency: 1, node-version: 22.13.0 }。
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 托管 runner 偶发与代码无关的抖动（进程初始化失败等）。失败即重跑：
      # turbo 缓存跳过已完成任务，重试只补跑失败点，开销小。三次仍败才算真红。
      - name: Typecheck, test, and build
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm turbo run typecheck test build --concurrency=${{ matrix.turbo-concurrency }}; then
              exit 0
            fi
            echo "::warning::turbo run failed (attempt $attempt/3); retrying — turbo cache skips completed tasks"
          done
          exit 1
      - name: Assert Rolldown single-bin output
        shell: bash
        run: |
          test -f apps/cli/dist/volund.js
          test "$(find apps/cli/dist -type f -name '*.js' | wc -l | tr -d ' ')" = 1
          head -n 1 apps/cli/dist/volund.js | grep -Fx '#!/usr/bin/env node'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.runner }}
          path: apps/cli/dist/volund.js
