name: L1 TypeScript
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test build
      - name: Assert Rolldown single-bin output
        shell: bash
        run: |
          test -f apps/cli/dist/apollo.js
          test "$(find apps/cli/dist -type f -name '*.js' | wc -l | tr -d ' ')" = 1
          head -n 1 apps/cli/dist/apollo.js | grep -Fx '#!/usr/bin/env node'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.runner }}
          path: apps/cli/dist/apollo.js
