<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Apollo Code</title>
  <desc id="desc">A permission-first, provider-neutral coding agent for the terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b0b"/>
      <stop offset="0.55" stop-color="#101616"/>
      <stop offset="1" stop-color="#08110d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#b9f559" stop-opacity=".2"/>
      <stop offset="1" stop-color="#b9f559" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b9f559" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b9f559"/>
      <stop offset="1" stop-color="#b9f559" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b9f559" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="23" fill="none" stroke="#b9f559" stroke-opacity=".18"/>
  <rect width="1200" height="480" rx="24" fill="url(#grid)"/>
  <ellipse cx="920" cy="230" rx="300" ry="250" fill="url(#glow)" filter="url(#blur)"/>

  <g transform="translate(92 82)">
    <rect width="56" height="56" rx="12" fill="#b9f559"/>
    <path d="M12 42 25.8 14h5.8L45 42h-7.4L35 36H22.5L20 42h-8Zm13-12h7.4l-3.7-8.5L25 30Z" fill="#0a0d0d"/>
    <text x="72" y="39" fill="#f4f7f3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" letter-spacing="2">APOLLO CODE</text>
  </g>

  <text x="92" y="213" fill="#f4f7f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="55" font-weight="700" letter-spacing="-2">Ship code with an agent</text>
  <text x="92" y="275" fill="#b9f559" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="55" font-weight="700" letter-spacing="-2">you can actually inspect.</text>
  <text x="94" y="326" fill="#9ba8a2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Permission-first  ·  Provider-neutral  ·  Terminal-native  ·  Open source</text>

  <g transform="translate(94 374)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <rect width="374" height="48" rx="8" fill="#0d1211" stroke="#26322d"/>
    <circle cx="20" cy="24" r="4" fill="#b9f559"/>
    <text x="36" y="29" fill="#738078">$</text>
    <text x="55" y="29" fill="#e8ede9">apollo chat</text>
    <rect x="163" y="18" width="8" height="16" fill="#b9f559" opacity=".85"/>
  </g>

  <g transform="translate(770 87)">
    <circle cx="168" cy="150" r="126" fill="none" stroke="#b9f559" stroke-opacity=".16"/>
    <circle cx="168" cy="150" r="92" fill="none" stroke="#b9f559" stroke-opacity=".3" stroke-dasharray="4 10"/>
    <circle cx="168" cy="150" r="58" fill="#0a0d0d" stroke="#b9f559" stroke-width="2"/>
    <path d="M131 180 160 119h16l29 61h-19l-7-15h-36l-7 15h-5Zm19-31h22l-11-25-11 25Z" fill="#b9f559"/>
    <path d="M111 196h114" stroke="url(#line)" stroke-width="2"/>
    <circle cx="168" cy="24" r="5" fill="#b9f559"/>
    <circle cx="259" cy="213" r="4" fill="#b9f559"/>
    <circle cx="83" cy="226" r="3" fill="#b9f559"/>
  </g>
</svg>
